<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Descubre El Salvador</title>
    <link rel="stylesheet" href="../CSS/registro.CSS">
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f5f5f5;">

    <!-- MENÚ -->
    <nav class="menu" aria-label="Navegacion principal">

        <a href="../index.html">REGRESAR</a>
        
    </nav>

    <main class="login-wrap">

        <!-- Panel visual -->
        <section class="login-visual" aria-hidden="true">
            <div class="login-visual-overlay"></div>
            <p class="login-visual-eyebrow">Descubre El Salvador</p>
            <h1 class="login-visual-titulo">Tu próxima<span>aventura</span>te espera</h1>
            <p class="login-visual-texto">Guarda tus destinos favoritos, arma tu propia ruta y vuelve a encontrarla cuando quieras.</p>
        </section>

        <!-- de formulario -->
        <section class="login-panel" aria-labelledby="titulo-login">

            <form class="login-form" id="formLogin" novalidate>
                <h2 id="titulo-login">Registrarse</h2>
                <p class="login-sub">Registre sus datos para continuar</p>


                <label class="campo">
                    <span>Nombre</span>
                    <input type="text" name="nombre" placeholder="Tu nombre..." required autocomplete="text">
                </label>

                <label class="campo">
                    <span>Correo electrónico</span>
                    <input type="email" name="correo" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                </label>

                <label class="campo">
                    <span>Contraseña</span>
                    <div class="campo-clave">
                        <input type="password" name="clave" id="inputClave" placeholder="Tu contraseña" required autocomplete="new-password" minlength="6">
                        <button type="button" class="ver-clave" id="botonVerClave" aria-label="Mostrar contraseña">Ver</button>
                    </div>
                </label>

                 <label class="campo">
                    <span>Confirmar contraseña</span>
                    <div class="campo-clave">
                        <input type="password" name="clave2" id="inputClave2" placeholder="Repite tu contraseña" required autocomplete="new-password" minlength="6">
                        <button type="button" class="ver-clave" id="botonVerClave2" aria-label="Mostrar contraseña">Ver</button>
                    </div>
                    <span class="mensaje-error" id="mensajeError" role="alert" aria-live="polite"></span>
                </label>


                <button type="submit" class="boton-entrar">Entrar</button>

                <p class="login-registro">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>

        </section>

    </main>

    <script src="../JS/registro.js"></script>
</body>
</html>
